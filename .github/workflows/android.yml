name: Android APK

# 手動で実行します（Actions タブ → Android APK → Run workflow）。
# できた APK は、実行結果の「Artifacts」からダウンロードできます（社内配布用・開発用の署名です）。
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'サーバー保存に使うVercelのURL（例 https://xxx.vercel.app）。空ならサーバー保存なし'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run build:web
        env:
          APP_URL: ${{ inputs.app_url }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: アプリ名とアイコンを設定
        run: python3 ../native/tools/android_icons.py
      - run: ./gradlew assembleDebug
        working-directory: native/android
      - uses: actions/upload-artifact@v4
        with:
          name: kokuban-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
